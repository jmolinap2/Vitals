name: Build

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  integrity:
    name: Repository integrity
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Security integrity checks
        shell: pwsh
        run: ./.github/scripts/repository-integrity.ps1

  build:
    name: Build
    needs: integrity
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Vitals.slnx

      - name: Build
        run: dotnet build Vitals.slnx --configuration Release --no-restore
